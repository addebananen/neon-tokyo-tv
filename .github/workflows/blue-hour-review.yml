name: Blue Hour TV review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  tv-review:
    if: github.head_ref == 'feat/cloud-tv-theme-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and unit tests
        run: |
          git clone --depth 1 https://github.com/LumeraD3v/assrender ../assrender
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Prepare UI-only emulator copy
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ui-test.apk
          zip -q -d ui-test.apk 'lib/*' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.MF' || true
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 ui-test.apk aligned.apk
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --out ui-test.apk aligned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture and exercise launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/blue-hour-review.sh ui-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blue-hour-tv-review
          path: |
            tv-review/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14
