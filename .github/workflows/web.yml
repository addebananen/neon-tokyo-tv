name: Neon Tokyo Web

# Publishes web/ to GitHub Pages: https://addebananen.github.io/neon-tokyo-tv/
# One-time setup: repo Settings › Pages › Build and deployment › Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in web/js/*.js web/sw.js; do node --check "$f"; done
      - name: Core rules test
        run: node web/test/core.test.mjs
      - name: Stamp the build number
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/g" web/js/app.js web/sw.js
          rm -rf web/test
      # Trakt's Client ID is public by design (every request from the page carries it), so it
      # comes from the repository's Variables (Settings > Secrets and variables > Actions >
      # Variables: TRAKT_CLIENT_ID). The client secret never goes into the web page.
      - name: Trakt app id for the web page
        env:
          TRAKT_ID: ${{ vars.TRAKT_CLIENT_ID }}
        run: |
          if [ -z "$TRAKT_ID" ]; then echo "No TRAKT_CLIENT_ID variable: Trakt stays off on the web"; exit 0; fi
          # A wrong value must not stop the site from publishing: Trakt just stays off until it is fixed
          if ! [[ "$TRAKT_ID" =~ ^[A-Za-z0-9]+$ ]]; then echo "::warning::TRAKT_CLIENT_ID should be the Trakt app's Client ID (letters and digits only), so Trakt stays off on the web"; exit 0; fi
          sed -i "s/__TRAKT_ID__/$TRAKT_ID/" web/js/trakt.js
          echo "Trakt is on for the web page"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
