name: Build APK

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      full:
        description: Run the whole TV test (every home style, both profiles), as a release does
        type: boolean
        default: false
      prerelease:
        description: Publish the APK as a test release once the TV test passes, to install on the TV before it reaches main
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_NAME: 0.2.0-nt.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # The subtitle renderer lives in a sibling repository (see settings.gradle.kts)
      - name: Fetch assrender module
        run: git clone --depth 1 https://github.com/LumeraD3v/assrender ../assrender

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # assrender builds native code with the NDK; AGP's own on-demand download of it
      # sometimes arrives corrupt, so fetch it up front with retries
      - name: Install NDK
        run: |
          for i in 1 2 3 4; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null && break
            echo "NDK download failed, retry $i"; rm -rf "$ANDROID_HOME/ndk/27.0.12077973"; sleep $((i * 10))
          done
          test -f "$ANDROID_HOME/ndk/27.0.12077973/source.properties"

      # The Siri Remote engine is Rust (native/siri-remote); its tests run on the runner, then it
      # is built for the TV's ARM cores into jniLibs, where Gradle packs it into the APK
      - name: Build Siri Remote engine
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android
          cargo install cargo-ndk --locked --version 3.5.4
          cd native/siri-remote
          # unit tests, millions of random reports, then the pretend remote's scenarios through
          # the engine (the emulator test plays the same ones through the real bridge)
          cargo test --release
          python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('opus') else 1)" \
            || (sudo apt-get update -q && sudo apt-get install -y -q libopus0)
          python3 ../../.github/scripts/siri-sim.py make /tmp/siri-sim
          cargo run -q --release --example sim -- /tmp/siri-sim/remote.sim > /tmp/siri-sim/remote.log
          python3 ../../.github/scripts/siri-sim.py check /tmp/siri-sim/remote.log remote
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973" cargo ndk -t arm64-v8a -t armeabi-v7a --platform 26 \
            -o ../../app/src/main/jniLibs build --release
          ls -l ../../app/src/main/jniLibs/*/libneon_siri.so
          # an x86 copy for the emulator test only, outside the APK
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973" cargo ndk -t x86 --platform 26 -o ../../siri-x86 build --release

      - name: Write local.properties
        run: echo "tmdb.api_key=${TMDB_API_KEY}" > local.properties

      - name: Decode signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PntVersionCode=${{ github.run_number }}0 -PntVersionName=$VERSION_NAME --stacktrace

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "neon-tokyo-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: siri-x86
          path: siri-x86/x86/libneon_siri.so
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: neon-tokyo-apk
          path: neon-tokyo-*.apk
          retention-days: 7

  # Runs the TV setup script against a fake TV and checks that undo puts everything back
  tv-setup-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test neon-tv.ps1
        run: bash .github/scripts/tv-setup-test.sh

  # Boots an Android TV 11 emulator (same Android version as the TCL C845),
  # clicks through the app with the remote's D-pad and fails on any crash.
  tv-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: neon-tokyo-apk

      - uses: actions/download-artifact@v4
        with:
          name: siri-x86
          path: siri-x86

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator is x86, the APK only ships ARM native code (torrent engine, subtitle renderer).
      # Strip it for the test copy so it installs; the UI under test is pure Kotlin.
      - name: Prepare test APK
        run: |
          APK=$(ls neon-tokyo-*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$APK" stripped.apk
          zip -q -d stripped.apk 'lib/*' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.MF' || true
          "$BT/zipalign" -f 4 stripped.apk aligned.apk
          keytool -genkeypair -keystore test.jks -storepass android -keypass android -alias test \
            -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Neon Tokyo Test"
          "$BT/apksigner" sign --ks test.jks --ks-pass pass:android --key-pass pass:android --out neon-tokyo-test.apk aligned.apk
          # The wallpaper provider hands Projectivy android.resource://<package>/<type>/<name> addresses,
          # which resolve when the resource table carries the package name
          "$BT/aapt2" dump resources neon-tokyo-test.apk 2>/dev/null | grep -m1 "Package name" || true

      # Everyday builds run the quick test; the build for a release on main runs all of it
      - name: Run TV smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SIRI_LIB: siri-x86/libneon_siri.so
          SMOKE_MODE: ${{ (github.ref == 'refs/heads/main' || inputs.full) && 'full' || 'quick' }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/tv-smoke.sh neon-tokyo-test.apk tv-shots

      # Screenshots are for reading, not a check: a push that loses a race with another run's
      # screenshots must never hold back a release whose test passed
      - name: Publish screenshots to the ci-screens branch
        if: always()
        continue-on-error: true
        run: |
          [ -d tv-shots ] || exit 0
          cd tv-shots
          echo "run ${{ github.run_number }} · ${{ github.sha }} · ${{ github.ref_name }}" > RUN.txt
          git init -q -b ci-screens
          git config user.name "neon-tokyo-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "TV smoke test screenshots, run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screens

  # The Siri Remote end to end on Android TV 14 (as on TV 1), with a pretend remote: buttons,
  # touch scrolling, Power off and on, and voice through the TV's own Opus decoder
  siri-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: neon-tokyo-apk

      - uses: actions/download-artifact@v4
        with:
          name: siri-x86
          path: siri-x86

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare test APKs
        run: |
          python3 -c "import ctypes.util, sys; sys.exit(0 if ctypes.util.find_library('opus') else 1)" \
            || (sudo apt-get update -q && sudo apt-get install -y -q libopus0)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          keytool -genkeypair -keystore test.jks -storepass android -keypass android -alias test \
            -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Neon Tokyo Test"
          # Neon Tokyo without its ARM libraries (the emulator is x86), as in tv-test
          APK=$(ls neon-tokyo-*.apk | head -1)
          cp "$APK" stripped.apk
          zip -q -d stripped.apk 'lib/*' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.MF' || true
          "$BT/zipalign" -f 4 stripped.apk aligned.apk
          "$BT/apksigner" sign --ks test.jks --ks-pass pass:android --key-pass pass:android --out neon-tokyo-test.apk aligned.apk
          # the stand-in speech recognizer and the Hikari app
          mkdir -p st/classes
          javac -source 11 -target 11 -classpath "$JAR" -d st/classes $(find .github/siri-test/src -name '*.java')
          "$BT/d8" --min-api 26 --lib "$JAR" --output st $(find st/classes -name '*.class')
          "$BT/aapt2" link -o st/base.apk --manifest .github/siri-test/AndroidManifest.xml -I "$JAR"
          (cd st && zip -q base.apk classes.dex)
          "$BT/zipalign" -f 4 st/base.apk st/aligned.apk
          "$BT/apksigner" sign --ks test.jks --ks-pass pass:android --key-pass pass:android --out siritest.apk st/aligned.apk

      - name: Run Siri Remote test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/siri-test.sh neon-tokyo-test.apk siri-x86/libneon_siri.so siri-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siri-test
          path: siri-out
          retention-days: 7

  release:
    needs: [build, tv-test, tv-setup-test, siri-test]
    if: github.ref == 'refs/heads/main' || inputs.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neon-tokyo-apk

      - name: Checksum
        run: echo "SHA256=$(sha256sum neon-tokyo-$VERSION_NAME.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Neon Tokyo ${{ env.VERSION_NAME }}${{ github.ref != 'refs/heads/main' && format(' (test, {0})', github.ref_name) || '' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build from ${{ github.sha }} (${{ github.ref_name }}). Passed the Android TV emulator test.

            SHA-256: ${{ env.SHA256 }}
          files: neon-tokyo-*.apk
