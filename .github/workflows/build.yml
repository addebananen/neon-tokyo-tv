name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      VERSION_NAME: 0.1.8-nt.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # The subtitle renderer lives in a sibling repository (see settings.gradle.kts)
      - name: Fetch assrender module
        run: git clone --depth 1 https://github.com/LumeraD3v/assrender ../assrender

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "tmdb.api_key=${TMDB_API_KEY}" > local.properties

      - name: Decode signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -PntVersionCode=${{ github.run_number }}0 -PntVersionName=$VERSION_NAME --stacktrace

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" "neon-tokyo-$VERSION_NAME.apk"
          echo "SHA256=$(sha256sum neon-tokyo-$VERSION_NAME.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: neon-tokyo-apk
          path: neon-tokyo-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Neon Tokyo ${{ env.VERSION_NAME }}
          body: |
            Automatic build from ${{ github.sha }}.

            SHA-256: ${{ env.SHA256 }}
          files: neon-tokyo-*.apk
