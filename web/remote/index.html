<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Neon Remote</title>
  <meta name="description" content="Your phone as the Neon Tokyo TV's remote: swipe, type, search and talk.">
  <meta name="theme-color" content="#0D0721">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon Remote">
  <meta name="referrer" content="no-referrer">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="remote.css?v=1">
  <script src="remote.js?v=1" defer></script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"></div>
  <main id="app" class="app"></main>
  <label class="haptic" aria-hidden="true"><input type="checkbox" switch id="haptic" tabindex="-1"></label>
  <noscript>The remote needs JavaScript.</noscript>
</body>
</html>
