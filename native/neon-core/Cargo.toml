[package]
name = "neon-core"
version = "0.1.0"
edition = "2021"
description = "Shared core of Neon Tokyo: Stremio addon protocol, catalogs, watch state and sync rules for the Android, Apple and Windows apps"
license = "MIT"
publish = false

[lib]
name = "neon_core"
# staticlib for the Apple apps (XCFramework), cdylib for Windows/Android (JNA/JNI), rlib for tests
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
uniffi = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
# UniFFI reads its interface from the library's symbols, so keep them; only drop debug info
strip = "debuginfo"
