[package]
name = "neon-siri"
version = "0.1.0"
edition = "2021"
description = "Apple Siri Remote support for Neon Tokyo: report decoding and Apple TV-style touch scrolling"
license = "MIT"
publish = false

[lib]
name = "neon_siri"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
